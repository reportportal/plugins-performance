name: Release

on:
  push:
    tags:
      - 'v*'
      - 'jmeter-v*'
      - 'gatling-v*'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to release'
        required: true
        type: choice
        options:
          - jmeter
          - gatling
          - all
        default: jmeter
      version:
        description: 'Release version without v prefix (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve release
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLUGIN="${{ inputs.plugin }}"
            VERSION="${{ inputs.version }}"
          else
            REF="${GITHUB_REF_NAME}"
            case "$REF" in
              jmeter-v*)  PLUGIN=jmeter;  VERSION="${REF#jmeter-v}" ;;
              gatling-v*) PLUGIN=gatling; VERSION="${REF#gatling-v}" ;;
              v*)         PLUGIN=all;     VERSION="${REF#v}" ;;
              *) echo "Unsupported tag: $REF"; exit 1 ;;
            esac
          fi

          if [ -z "$VERSION" ]; then
            echo "Version is empty"
            exit 1
          fi

          case "$PLUGIN" in
            jmeter)
              TAG="jmeter-v${VERSION}"
              TITLE="JMeter ${VERSION}"
              MODULES="jmeter-plugin"
              FILES="jmeter-plugin/target/plugin-jmeter-reportportal-*.jar"
              ;;
            gatling)
              TAG="gatling-v${VERSION}"
              TITLE="Gatling ${VERSION}"
              MODULES="gatling-akka,gatling-pekko"
              FILES="gatling-akka/target/plugin-gatling-akka-reportportal-*.jar"
              ;;
            all)
              TAG="v${VERSION}"
              TITLE="Release ${VERSION}"
              MODULES="jmeter-plugin,gatling-akka,gatling-pekko"
              FILES="$(printf '%s\n' \
                'jmeter-plugin/target/plugin-jmeter-reportportal-*.jar' \
                'gatling-akka/target/plugin-gatling-akka-reportportal-*.jar')"
              ;;
            *)
              echo "Unknown plugin: $PLUGIN"
              exit 1
              ;;
          esac

          echo "plugin=${PLUGIN}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "modules=${MODULES}" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            echo "${FILES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B clean package -Drevision=${{ steps.meta.outputs.version }} -pl ${{ steps.meta.outputs.modules }} -am

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          generate_release_notes: true
          make_latest: ${{ steps.meta.outputs.plugin == 'all' }}
          fail_on_unmatched_files: true
          files: ${{ steps.meta.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
