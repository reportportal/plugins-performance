name: Release

on:
  push:
    tags:
      - 'v*'
      - 'jmeter-v*'
      - 'gatling-v*'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin to release'
        required: true
        type: choice
        options:
          - jmeter
          - gatling
          - all
        default: jmeter
      version:
        description: 'Release version without v prefix (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    outputs:
      plugin: ${{ steps.meta.outputs.plugin }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve release
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLUGIN="${{ inputs.plugin }}"
            VERSION="${{ inputs.version }}"
          else
            REF="${GITHUB_REF_NAME}"
            case "$REF" in
              jmeter-v*)  PLUGIN=jmeter;  VERSION="${REF#jmeter-v}" ;;
              gatling-v*) PLUGIN=gatling; VERSION="${REF#gatling-v}" ;;
              v*)         PLUGIN=all;     VERSION="${REF#v}" ;;
              *) echo "Unsupported tag: $REF"; exit 1 ;;
            esac
          fi

          if [ -z "$VERSION" ]; then
            echo "Version is empty"
            exit 1
          fi

          case "$PLUGIN" in
            jmeter)
              TAG="jmeter-v${VERSION}"
              TITLE="JMeter ${VERSION}"
              MODULES="plugin-jmeter"
              FILES="plugin-jmeter/target/plugin-jmeter-*-shaded.jar"
              ;;
            gatling)
              TAG="gatling-v${VERSION}"
              TITLE="Gatling ${VERSION}"
              MODULES="plugin-gatling-akka,plugin-gatling-pekko"
              FILES="plugin-gatling-akka/target/plugin-gatling-akka-*-shaded.jar"
              ;;
            all)
              TAG="v${VERSION}"
              TITLE="Release ${VERSION}"
              MODULES="plugin-jmeter,plugin-gatling-akka,plugin-gatling-pekko"
              FILES="$(printf '%s\n' \
                'plugin-jmeter/target/plugin-jmeter-*-shaded.jar' \
                'plugin-gatling-akka/target/plugin-gatling-akka-*-shaded.jar')"
              ;;
            *)
              echo "Unknown plugin: $PLUGIN"
              exit 1
              ;;
          esac

          echo "plugin=${PLUGIN}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "modules=${MODULES}" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            echo "${FILES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B clean package -Drevision=${{ steps.meta.outputs.version }} -pl ${{ steps.meta.outputs.modules }} -am

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          generate_release_notes: true
          make_latest: ${{ steps.meta.outputs.plugin == 'all' }}
          fail_on_unmatched_files: true
          files: ${{ steps.meta.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Only the Maven-consumable modules go to GitHub Packages, which is where
  # the "Publish to Maven Central" workflow later picks them up from.
  packages:
    name: Deploy Maven artifacts to GitHub Packages
    needs: release
    if: needs.release.outputs.plugin != 'jmeter'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Deploy signed artifacts
        run: >
          ./mvnw -B -Pmaven-central,sign deploy
          -Drevision=${{ needs.release.outputs.version }}
          -Daether.checksums.algorithms=MD5,SHA-1,SHA-256,SHA-512
          -pl commons-performance,plugin-gatling-akka -am
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
