name: CI Build

on:
  push:
    branches:
      - '**'
      - '!main'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build plugins
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B clean package

      - name: Upload JMeter plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin-jmeter-reportportal
          path: jmeter-plugin/target/plugin-jmeter-reportportal-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gatling Akka plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin-gatling-akka-reportportal
          path: gatling-akka/target/plugin-gatling-akka-reportportal-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gatling Pekko plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin-gatling-pekko-reportportal
          path: gatling-pekko/target/*.jar
          if-no-files-found: warn
          retention-days: 14
