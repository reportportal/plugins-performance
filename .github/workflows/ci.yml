name: CI Build

on:
  push:
    branches:
      - '**'
      - '!main'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build plugins
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B -Pmaven-central clean package

      - name: Check Maven Central artifacts
        run: |
          set -euo pipefail
          require() { ls "$1" >/dev/null; }
          require 'commons-performance/target/commons-performance-*-sources.jar'
          require 'commons-performance/target/commons-performance-*-javadoc.jar'
          require 'plugin-gatling-akka/target/plugin-gatling-akka-*-sources.jar'
          require 'plugin-gatling-akka/target/plugin-gatling-akka-*-javadoc.jar'
          require 'plugin-gatling-akka/target/plugin-gatling-akka-*-shaded.jar'
          ls commons-performance/target/commons-performance-*.jar | grep -vE -- '-(sources|javadoc|shaded)\.jar$'
          ls plugin-gatling-akka/target/plugin-gatling-akka-*.jar | grep -vE -- '-(sources|javadoc|shaded)\.jar$'

      - name: Upload JMeter plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin-jmeter
          path: plugin-jmeter/target/plugin-jmeter-*-shaded.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gatling Akka plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin-gatling-akka
          path: plugin-gatling-akka/target/plugin-gatling-akka-*-shaded.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gatling Pekko plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin-gatling-pekko
          path: plugin-gatling-pekko/target/plugin-gatling-pekko-*.jar
          if-no-files-found: warn
          retention-days: 14
